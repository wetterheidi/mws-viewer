# Vhost mit Pförtner-Auth (siehe wetterheidi/Nutzerverwaltung).
# Wird von setup-server.sh nach /etc/nginx/sites-available/mwsviewer.wetterheidi.de
# kopiert. certbot --nginx ergänzt anschließend automatisch die 443/SSL-Blöcke
# und die HTTP→HTTPS-Weiterleitung.
#
# Voraussetzung auf dem Server: /etc/nginx/snippets/pfoertner.conf existiert
# bereits (gemeinsam für alle Pförtner-Tools) und der Pförtner-Dienst
# (Nutzerverwaltung-Repo, gate_app.py) läuft auf 127.0.0.1:8100.

server {
    listen 80;
    server_name mwsviewer.wetterheidi.de;

    # --- Pförtner ---
    set $pfoertner_tool mwsviewer;
    auth_request /_pfoertner;
    error_page 401 = @zum_login;
    error_page 403 /gesperrt.html;
    include snippets/pfoertner.conf;

    # Antwort-Header des Pförtners abgreifen und an mws-viewer durchreichen
    # (mws_server.py liest X-Remote-User/X-Tool-Admin, siehe _is_admin()):
    auth_request_set $auth_user       $upstream_http_x_auth_user;
    auth_request_set $auth_tool_admin $upstream_http_x_auth_tool_admin;

    # Admin-Seite: nur für Tool-Admins (Prefix deckt auch /admin/... ab)
    location /admin {
        auth_request /_pfoertner_admin;

        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   X-Remote-User     $auth_user;
        proxy_set_header   X-Tool-Admin      $auth_tool_admin;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Admin-API: gleiche Sperre (liegt außerhalb von /admin!)
    location /api/admin {
        auth_request /_pfoertner_admin;

        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   X-Remote-User     $auth_user;
        proxy_set_header   X-Tool-Admin      $auth_tool_admin;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   X-Remote-User     $auth_user;
        proxy_set_header   X-Tool-Admin      $auth_tool_admin;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
